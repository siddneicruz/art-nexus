name: Gerar APK
on:
  push:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: node preparar.js
      - run: npx cap add android
      - name: Ícone do app e tela cheia
        run: |
          sudo apt-get install -y imagemagick >/dev/null
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          for p in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${p%%:*}; s=${p##*:}
            for n in ic_launcher ic_launcher_round ic_launcher_foreground; do
              convert jogo/assets/icone-512.png -resize ${s}x${s} $R/mipmap-$d/$n.png
            done
          done
      - run: npx cap sync android
      - name: Compilar
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: art-nexus-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar atualização automática (OTA)
        if: github.ref_name == 'main'
        continue-on-error: true
        env: { OTA_TOKEN: "${{ secrets.OTA_TOKEN }}" }
        run: |
          if [ -z "$OTA_TOKEN" ]; then echo "OTA_TOKEN não configurado; pulando"; exit 0; fi
          F=https://bcvfkusmpcsgbhyyrqnk.supabase.co/functions/v1/publicar-ota
          V=$(sed -n 's/.*APP_VERSAO = "\(.*\)".*/\1/p' www/js/versao.js)
          (cd www && zip -qr ../ota.zip .)
          U=$(curl -sf -X POST $F -H "x-ota-token: $OTA_TOKEN" -d "{\"acao\":\"iniciar\",\"versao\":\"$V\"}" | python3 -c "import sys,json;print(json.load(sys.stdin)['url'])")
          curl -sf -X PUT "$U" -H "Content-Type: application/zip" --data-binary @ota.zip
          curl -sf -X POST $F -H "x-ota-token: $OTA_TOKEN" -d "{\"acao\":\"concluir\",\"versao\":\"$V\"}"
      - name: Publicar em Releases (link fixo para baixar no celular)
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk art-nexus.apk
          TAG=apk-atual; TITULO="Art Nexus (APK)"
          if [ "$GITHUB_REF_NAME" != "main" ]; then TAG="apk-teste-$GITHUB_REF_NAME"; TITULO="Art Nexus (APK de teste: $GITHUB_REF_NAME)"; fi
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" art-nexus.apk --target "$GITHUB_SHA" --title "$TITULO" --notes "Baixe o art-nexus.apk e instale no Android."
